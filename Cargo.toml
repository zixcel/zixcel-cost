[package]
include = ["/src/**", "/tests/**", "/examples/**", "/docs/**", "/Cargo.toml", "/README.md", "/LICENSE", "/NOTICE", "/schemas/**"]
name = "zixcel-inference-cost"
version = "0.10.0"
edition = "2024"
rust-version = "1.97"
description = "Provider-neutral deterministic inference usage and cost estimation"
license = "Apache-2.0"
readme = "README.md"
repository = "https://github.com/zixcel/zixcel-inference-cost"
homepage = "https://github.com/zixcel/zixcel-inference-cost"
documentation = "https://docs.rs/zixcel-inference-cost"
publish = ["crates-io"]

[package.metadata.zixcel]
boundary = "inference-usage-and-cost"
external_actions = false
network_transport_owner = "crowsi"

[workspace]
members = ["."]
resolver = "3"

[dependencies]
serde = { version = "1.0.228", features = ["derive"] }
serde_json = "1.0.149"
sha2 = "0.10.9"

[lints.rust]
unsafe_code = "forbid"

[lints.clippy]
all = "warn"
pedantic = "warn"
